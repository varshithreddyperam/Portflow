<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ports Management - PortFlow</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/styles.css?v=4.0">
</head>
<body>
  <div id="wrapper">
    <div id="sidebar">
      <div class="brand-header"><i class="bi bi-compass"></i> PortFlow</div>
      <ul class="sidebar-nav">
        <li class="nav-item"><a href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
        <li class="nav-item"><a href="ports.html"><i class="bi bi-geo-alt"></i> Ports</a></li>
        <li class="nav-item"><a href="ships.html"><i class="bi bi-water"></i> Ships</a></li>
        <li class="nav-item"><a href="containers.html"><i class="bi bi-box-seam"></i> Containers</a></li>
        <li class="nav-item"><a href="routes.html"><i class="bi bi-signpost-split"></i> Routes</a></li>
        <li class="nav-item"><a href="simulation.html"><i class="bi bi-play-circle"></i> Simulation</a></li>
        <li class="nav-item"><a href="reports.html"><i class="bi bi-file-earmark-bar-graph"></i> Reports</a></li>
        <li class="nav-item"><a href="profile.html"><i class="bi bi-person-circle"></i> Profile</a></li>
      </ul>
    </div>

    <div id="main-content">
      <div class="top-navbar">
        <h4 class="m-0 font-weight-bold text-dark">Port Management</h4>
        <div class="d-flex align-items-center gap-3">
          <button id="themeToggleBtn" class="btn btn-outline-secondary btn-sm"><i class="bi bi-moon-stars-fill"></i> Dark Mode</button>
          <div class="d-flex align-items-center gap-2">
            <i class="bi bi-person-circle fs-4 text-secondary"></i>
            <div>
              <div id="userDisplay" class="fw-semibold text-dark">Admin</div>
              <small id="roleBadge" class="badge bg-secondary">Administrator</small>
            </div>
          </div>
          <button onclick="App.logout()" class="btn btn-sm btn-outline-danger"><i class="bi bi-box-arrow-right"></i> Logout</button>
        </div>
      </div>

      <div class="content-body">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div class="input-group style-search" style="max-width: 350px;">
            <span class="input-group-text bg-white border-end-0 text-secondary"><i class="bi bi-search"></i></span>
            <input type="text" id="searchPortInput" class="form-control border-start-0 ps-0" placeholder="Search ports by name...">
          </div>
          <button class="btn btn-success" onclick="resetPortForm()" data-bs-toggle="modal" data-bs-target="#portModal"><i class="bi bi-plus-lg me-1"></i> Add New Port</button>
        </div>

        <div id="portsGrid" class="row">
          <div class="col-12 text-center text-muted">Loading ports...</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Port Modal -->
  <div class="modal fade" id="portModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content shadow-lg">
        <div class="modal-header">
          <h5 class="modal-title" id="portModalTitle">Add New Port</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <form id="portForm">
          <input type="hidden" id="portId">
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label">Port Name</label>
              <input type="text" id="portName" class="form-control" required placeholder="e.g. Port of Rotterdam">
            </div>
            <div class="row g-2 mb-3">
              <div class="col-6">
                <label class="form-label">X Coordinate</label>
                <input type="number" step="0.1" id="portX" class="form-control" required value="10.0">
              </div>
              <div class="col-6">
                <label class="form-label">Y Coordinate</label>
                <input type="number" step="0.1" id="portY" class="form-control" required value="20.0">
              </div>
            </div>
            <div class="row g-2 mb-3">
              <div class="col-6">
                <label class="form-label">Dock Capacity (Ships)</label>
                <input type="number" id="portDockCap" class="form-control" required value="5">
              </div>
              <div class="col-6">
                <label class="form-label">Storage Capacity</label>
                <input type="number" id="portStorageCap" class="form-control" required value="200">
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-success">Save Port</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js?v=4.0"></script>
  <script src="js/auth.js?v=4.0"></script>
  <script src="js/api.js?v=4.0"></script>
  <script src="js/app.js?v=4.0"></script>
  <script src="js/pages/ports.js?v=4.0"></script>
</body>
</html>
