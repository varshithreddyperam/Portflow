<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PortFlow - Maritime Logistics & Port Simulation</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/styles.css?v=3.0">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100" style="background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);">

  <div class="container" style="max-width: 440px;">
    <div class="card glass-card p-4 shadow-lg border-0">
      <div class="text-center mb-4">
        <h2 class="fw-bold text-dark"><i class="bi bi-compass text-teal"></i> PortFlow</h2>
        <p class="text-muted small">Maritime Logistics & Port Simulation Workbench</p>
      </div>

      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label text-secondary small font-weight-semibold">Username</label>
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0 text-secondary"><i class="bi bi-person"></i></span>
            <input type="text" id="loginUsername" class="form-control border-start-0 ps-0" placeholder="Enter username" required value="admin">
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label text-secondary small font-weight-semibold">Password</label>
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0 text-secondary"><i class="bi bi-lock"></i></span>
            <input type="password" id="loginPassword" class="form-control border-start-0 ps-0" placeholder="Enter password" required value="admin123">
          </div>
        </div>

        <button type="submit" class="btn btn-success w-100 py-2.5 fw-semibold shadow-sm"><i class="bi bi-box-arrow-in-right me-2"></i>Sign In</button>
      </form>

      <div class="text-center mt-3">
        <small class="text-muted">Need an account? <a href="#" data-bs-toggle="modal" data-bs-target="#registerModal" class="text-teal fw-semibold">Register Here</a></small>
      </div>

      <div class="mt-4 pt-3 border-top text-center text-muted small">
        <strong>Demo Accounts:</strong><br>
        admin / admin123 | portmgr / port123 | fleetmgr / fleet123
      </div>
    </div>
  </div>

  <!-- Register Modal -->
  <div class="modal fade" id="registerModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content shadow-lg">
        <div class="modal-header">
          <h5 class="modal-title"><i class="bi bi-person-plus"></i> Register User</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <form id="registerForm">
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label">Username</label>
              <input type="text" id="regUsername" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" id="regEmail" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Password</label>
              <input type="password" id="regPassword" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Role</label>
              <select id="regRole" class="form-select">
                <option value="Viewer">Viewer</option>
                <option value="Fleet Manager">Fleet Manager</option>
                <option value="Port Manager">Port Manager</option>
                <option value="Administrator">Administrator</option>
              </select>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-success">Create Account</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js?v=3.0"></script>
  <script src="js/auth.js?v=3.0"></script>
  <script src="js/api.js?v=3.0"></script>
  <script src="js/app.js?v=3.0"></script>
  <script src="js/pages/login.js?v=3.0"></script>
</body>
</html>
