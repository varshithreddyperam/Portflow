<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile - PortFlow</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/styles.css?v=4.0">
</head>
<body>
  <div id="wrapper">
    <div id="sidebar">
      <div class="brand-header"><i class="bi bi-compass"></i> PortFlow</div>
      <ul class="sidebar-nav">
        <li class="nav-item"><a href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
        <li class="nav-item"><a href="ports.html"><i class="bi bi-geo-alt"></i> Ports</a></li>
        <li class="nav-item"><a href="ships.html"><i class="bi bi-water"></i> Ships</a></li>
        <li class="nav-item"><a href="containers.html"><i class="bi bi-box-seam"></i> Containers</a></li>
        <li class="nav-item"><a href="routes.html"><i class="bi bi-signpost-split"></i> Routes</a></li>
        <li class="nav-item"><a href="simulation.html"><i class="bi bi-play-circle"></i> Simulation</a></li>
        <li class="nav-item"><a href="reports.html"><i class="bi bi-file-earmark-bar-graph"></i> Reports</a></li>
        <li class="nav-item"><a href="profile.html"><i class="bi bi-person-circle"></i> Profile</a></li>
      </ul>
    </div>

    <div id="main-content">
      <div class="top-navbar">
        <h4 class="m-0 font-weight-bold text-dark">User Account Profile</h4>
        <div class="d-flex align-items-center gap-3">
          <button id="themeToggleBtn" class="btn btn-outline-secondary btn-sm"><i class="bi bi-moon-stars-fill"></i> Dark Mode</button>
          <div class="d-flex align-items-center gap-2">
            <i class="bi bi-person-circle fs-4 text-secondary"></i>
            <div>
              <div id="userDisplay" class="fw-semibold text-dark">Admin</div>
              <small id="roleBadge" class="badge bg-secondary">Administrator</small>
            </div>
          </div>
          <button onclick="App.logout()" class="btn btn-sm btn-outline-danger"><i class="bi bi-box-arrow-right"></i> Logout</button>
        </div>
      </div>

      <div class="content-body" style="max-width: 800px;">
        <div class="card glass-card p-4 mb-4">
          <h5 class="card-title text-dark mb-3"><i class="bi bi-person-badge-fill me-2 text-teal"></i> User Credentials & Role Info</h5>
          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label text-muted">Username</label>
              <input type="text" id="profUsername" class="form-control" readonly>
            </div>
            <div class="col-md-6">
              <label class="form-label text-muted">Email Address</label>
              <input type="email" id="profEmail" class="form-control" readonly>
            </div>
          </div>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label text-muted">Full Name</label>
              <input type="text" id="profFullName" class="form-control" readonly>
            </div>
            <div class="col-md-6">
              <label class="form-label text-muted">Role Permissions</label>
              <div><span id="profRoleBadge" class="badge fs-6 bg-secondary"></span></div>
            </div>
          </div>
        </div>

        <!-- Password Change Card -->
        <div class="card glass-card p-4">
          <h5 class="card-title text-warning mb-3"><i class="bi bi-key-fill me-2"></i> Security Settings - Change Password</h5>
          <form id="changePasswordForm">
            <div class="mb-3">
              <label class="form-label">Current Password</label>
              <input type="password" id="oldPassword" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label">New Password</label>
              <input type="password" id="newPassword" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Confirm New Password</label>
              <input type="password" id="confirmPassword" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-warning"><i class="bi bi-shield-lock-fill me-1"></i> Update Password</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js?v=4.0"></script>
  <script src="js/auth.js?v=4.0"></script>
  <script src="js/api.js?v=4.0"></script>
  <script src="js/app.js?v=4.0"></script>
  <script src="js/pages/profile.js?v=4.0"></script>
</body>
</html>
